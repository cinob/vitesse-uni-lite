<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 渐变定义 -->
    <!-- 背景光晕 -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#42d392" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#646cff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- UniApp 容器弧形底座 (U型底座渐变) -->
    <linearGradient id="uniGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="50%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#2bd980" />
    </linearGradient>

    <!-- Vitesse / Vue 翼展左侧 (Vite/Vue 渐变) -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd34fe" />
      <stop offset="45%" stop-color="#646cff" />
      <stop offset="100%" stop-color="#41b883" />
    </linearGradient>

    <!-- Vitesse / Vue 翼展右侧 (Vue/Uni 翠绿渐变) -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42d392" />
      <stop offset="60%" stop-color="#2b9939" />
      <stop offset="100%" stop-color="#007aff" />
    </linearGradient>

    <!-- 极速闪电 (Speed Bolt) 核心高亮渐变 -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="40%" stop-color="#ffb300" />
      <stop offset="75%" stop-color="#ff6d00" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>

    <!-- 闪电浅色辉光渐变 -->
    <linearGradient id="boltShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="0.2" />
    </linearGradient>

    <!-- 投影与发光滤镜 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 氛围光晕背景 -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)">
    <!-- 1. 外层 'U' 形轻量起手托底 (代表 UniApp 跨端生态底座) -->
    <path
      d="M 104 140
         C 104 115, 135 102, 154 120
         L 192 158
         C 192 230, 220 280, 256 280
         C 292 280, 320 230, 320 158
         L 358 120
         C 377 102, 408 115, 408 140
         C 408 280, 340 376, 256 376
         C 172 376, 104 280, 104 140 Z"
      fill="url(#uniGrad)"
      opacity="0.22"
    />

    <!-- 2. 主体 'V' 形翼展结构 (代表 Vitesse / Vite / Vue) -->
    <!-- 左翼 (Vite Purple -> Indigo -> Vue Green) -->
    <path
      d="M 96 112
         C 96 95, 118 86, 130 98
         L 256 390
         L 218 390
         C 210 390, 204 384, 200 376
         L 100 130
         C 97 124, 96 118, 96 112 Z"
      fill="url(#leftWing)"
    />

    <!-- 右翼 (Vue Emerald -> Green -> Uni Blue) -->
    <path
      d="M 416 112
         C 416 95, 394 86, 382 98
         L 256 390
         L 294 390
         C 302 390, 308 384, 312 376
         L 412 130
         C 415 124, 416 118, 416 112 Z"
      fill="url(#rightWing)"
    />

    <!-- 3. 中央立体倒三角 (Vue 经典多层几何结构) -->
    <path
      d="M 172 132
         L 256 320
         L 340 132
         C 345 120, 335 108, 322 108
         L 190 108
         C 177 108, 167 120, 172 132 Z"
      fill="#1e293b"
      opacity="0.9"
    />

    <path
      d="M 194 136
         L 256 276
         L 318 136
         Z"
      fill="#0f172a"
    />

    <!-- 4. 极速闪电核心 ⚡️ (Vitesse Speed 能量核心) -->
    <g filter="url(#boltGlow)">
      <!-- 闪电阴影层 -->
      <path
        d="M 282 64
           L 198 220
           L 248 220
           L 218 368
           L 326 196
           L 272 196
           Z"
        fill="url(#boltGrad)"
      />
      <!-- 闪电表面高光晶体 -->
      <path
        d="M 280 68
           L 204 216
           L 246 216
           L 224 350
           L 318 198
           L 270 198
           Z"
        fill="url(#boltShine)"
        opacity="0.85"
      />
    </g>

    <!-- 5. 科技光点与微粒子点缀 -->
    <circle cx="282" cy="64" r="5" fill="#ffffff" />
    <circle cx="218" cy="368" r="4" fill="#ffb300" />
    <circle cx="106" cy="112" r="4" fill="#bd34fe" />
    <circle cx="406" cy="112" r="4" fill="#42d392" />
    <circle cx="256" cy="406" r="5" fill="#00b4ff" />
  </g>
</svg>
